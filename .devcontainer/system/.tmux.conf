# Use tmux's own terminfo entry so truecolor and key handling work correctly in
# modern terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

# Forward a standalone Escape promptly to full-screen TUIs like lazygit.
set -s escape-time 10

# Anders custom keybinds
# Set prefix to <ctrl + a>
# Set base index to 1
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
set -g base-index 1

