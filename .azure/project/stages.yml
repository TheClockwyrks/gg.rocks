# The site's own stages, which azure-pipelines.yml includes after the publish
# stage; the mirror waits on each. The kit hands every parameter below, and the
# rendered ci/tests/test_wiring.py holds this file to them and to the stages
# render.py's PROJECT_PIPELINE names.
#
# `deploy` builds the site and uploads it to its Cloudflare Pages project once
# every gate passed, on `master` and `staging` alone (scripts/ci/deploy-site.sh
# says which project each deploys to): `master` is gg.rocks and `staging` is
# staging.gg.rocks. The superrepo's Releasing page, section "gg.rocks
# (Cloudflare Pages, one-time)", says how the projects are set up.
#
# It runs in the web image, the Node the gates ran the site's build in.
# CLOUDFLARE_API_TOKEN (a token holding "Cloudflare Pages: Edit") and
# CLOUDFLARE_ACCOUNT_ID are secret variables of the pipeline, so each is
# mapped into the step that uses it by name.
parameters:
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

stages:
  - stage: deploy
    displayName: Deploy
    # Named, so the stage follows the gates rather than the publish stage
    # before it, which a branch's run skips.
    dependsOn: gates
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    jobs:
      - job: site
        displayName: Build and deploy the site
        timeoutInMinutes: 20
        container: web
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          # The site names no package of the project today; the install is
          # authenticated to the feed all the same, as every install of the
          # kit's pipeline is, so one that comes to name one still deploys.
          - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
            displayName: Authenticate npm to the package feed
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - script: scripts/ci/deploy-site.sh "$(Build.SourceBranchName)"
            displayName: Build and deploy the site
            env:
              CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
              CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)
