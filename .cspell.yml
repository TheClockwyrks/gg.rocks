---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
dictionaryDefinitions:
  - name: android
    path: "./.cspell/android.txt"
  - name: barrow
    path: "./.cspell/barrow.txt"
  - name: cpp
    path: "./.cspell/cpp.txt"
    addWords: true
  - name: csharp
    path: "./.cspell/csharp.txt"
    addWords: true
  - name: genyume
    path: "./.cspell/genyume.txt"
    addWords: true
  - name: plantuml
    path: "./.cspell/plantuml.txt"
    addWords: true
  - name: python
    path: "./.cspell/python.txt"
    addWords: true
  - name: rust
    path: "./.cspell/rust.txt"
    addWords: true
  - name: rwby
    path: "./.cspell/rwby.txt"
    addWords: true
  - name: stardew
    path: "./.cspell/stardew.txt"
    addWords: true
  - name: typescript
    path: "./.cspell/typescript.txt"
    addWords: true
  - name: workspace
    path: "./.cspell/workspace.txt"
    addWords: true
dictionaries:
  - android
  - barrow
  - cpp
  - csharp
  - genyume
  - plantuml
  - python
  - rust
  - rwby
  - stardew
  - typescript
  - workspace
ignorePaths:
  - ".devcontainer/"
  - ".phoenix/"
  - "submodules/"
  - "coverage/"
  - "mutants/"
  - "site/"
  - "target/"
  - "user-guide/site/"
  - "**/*.db-journal"
  - "**/bin/"
  - "**/obj/"
  - "apps/*/dist/"
  - "apps/*/src-tauri/gen/"
  - "crates/**/pkg/"
  - "crates/*/test_data/**/build/"
  - "crates/*/test_data/**/out/"
  - "crates/*/test_data/**/target/"
  - "crates/*/test_data/logs/"
  # All files for an epic are AI generated. Don't bother spell checking these
  # because any issues are generally going to be from example code that uses
  # some abbreviation or similar that gets flagged.
  - "docs/**/epics/*"
  - "samples/*/dist/"
  - "samples/*/src-tauri/gen/"
  - "**/fonts/"
  - "**/node_modules/"
  - "**/snapshots/"
  - "**/storybook-static/"
  - ".editorconfig"
  - "*.code-workspace"
  - "*.snap"
  - "*.snap.new"
  - "*.svg"
  - "Cargo.toml"
  - "Directory.Build.props"
  - "**/tauri.conf.json"
  - "junit.xml"
  # This folder is used for short-lived, AI-generated markdown files
  - "tasks/**"
